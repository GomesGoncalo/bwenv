[project]
name = "bwenv"
version = "0.1.0"
description = "Load environment variables from a Bitwarden folder (profile) and exec your shell with them set"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bwenv = "bwenv.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
